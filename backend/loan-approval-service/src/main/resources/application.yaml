server:
  port: 8080

spring:
  application:
    name: loan-approval-service
  security:
    user:
      name: admin
      password: adminpassword
  datasource:
    url: jdbc:h2:mem:loandb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# Camunda Configuration
camunda:
  bpm:
    admin-user:
      id: admin
      password: adminpassword
      firstName: Admin
      lastName: Bank
    filter:
      create: All tasks